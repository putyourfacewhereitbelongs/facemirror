services:
  renderer:
    build: ./backend
    restart: unless-stopped
    volumes:
      - liveportrait-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 15m

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      renderer:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  liveportrait-models:
